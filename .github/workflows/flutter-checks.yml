name: Orbal Flutter checks and builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/orbal_flutter/**'
      - '.github/workflows/flutter-checks.yml'
  pull_request:
    paths:
      - 'apps/orbal_flutter/**'
      - '.github/workflows/flutter-checks.yml'
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orbal_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android,ios,windows,linux
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build:
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: ios
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/orbal_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android,ios,windows,linux
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - name: Bundle Microsoft Visual C++ runtime (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          $vsRoot = Join-Path $env:ProgramFiles "Microsoft Visual Studio\\2022"
          $crt = Get-ChildItem -Path $vsRoot -Directory -Recurse -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\\\x64\\\\Microsoft\\.VC\\d+\\.CRT$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $crt) {
            throw "Could not locate the x64 Microsoft Visual C++ runtime on this runner."
          }
          Copy-Item -Path (Join-Path $crt.FullName '*') -Destination $release -Recurse -Force
          if (-not (Test-Path (Join-Path $release 'msvcp140.dll'))) {
            throw "MSVCP140.dll was not bundled into the Windows release."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: orbal-${{ matrix.target }}
          path: apps/orbal_flutter/${{ matrix.artifact }}
          if-no-files-found: error
