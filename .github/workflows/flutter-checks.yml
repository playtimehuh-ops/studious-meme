name: Orbal Flutter checks and builds
on:
  push:
    paths:
      - 'apps/orbal_flutter/**'
      - '.github/workflows/flutter-checks.yml'
  pull_request:
    paths:
      - 'apps/orbal_flutter/**'
      - '.github/workflows/flutter-checks.yml'
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orbal_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android,ios,windows,linux
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: ios
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/orbal_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android,ios,windows,linux
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: orbal-${{ matrix.target }}
          path: apps/orbal_flutter/${{ matrix.artifact }}
          if-no-files-found: error
