name: Orbal Flutter checks
on:
  push:
    paths:
      - 'apps/orbal_flutter/**'
      - '.github/workflows/flutter-checks.yml'
  pull_request:
    paths:
      - 'apps/orbal_flutter/**'
      - '.github/workflows/flutter-checks.yml'
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orbal_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
